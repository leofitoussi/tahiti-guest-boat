name: Bug report
description: Report a reproducible bug in the site or content system.
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Provide enough detail for someone else to reproduce the problem quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to trigger the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Public page or route where the bug occurs.
      placeholder: /cruises/...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, branch, or deployment context.
      placeholder: Chrome 126 on macOS, main branch, preview deployment.
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Logs, screenshots, or other context.
