name: Implementation task
description: Create a concrete, ready-to-work issue for an agent or human.
title: "[Task]: "
labels:
  - ready-for-agent
body:
  - type: markdown
    attributes:
      value: |
        Use this template when the scope is already clear and the issue can move straight into implementation.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be delivered?
      placeholder: State the outcome in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope?
      placeholder: Include constraints, assumptions, and exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the task is done?
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Relevant documentation, designs, or URLs.
      placeholder: Links and notes.
