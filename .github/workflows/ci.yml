name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  # Trigger a Netlify production build only after a green build on main.
  # Netlify clones the repo and runs `npm run build`, publishing `dist`.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build & deploy
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK_URL }}")
          echo "Netlify build hook responded with HTTP $status"
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Netlify build hook failed (HTTP $status)"
            exit 1
          fi
