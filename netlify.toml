[build]
  command = "npm run build"
publish = "dist"

[[redirects]]
  from = "/api/tally-webhook"
  to = "/.netlify/functions/tally-webhook"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "22"

[[context.production.plugins]]
  package = "./netlify/plugins/indexnow"

[[redirects]]
  from = "/prototype/language-notification"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/prototype/language-notification/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/category/blog/"
  to = "/blog/"
  status = 301
  force = true

# Unknown English URLs keep the English experience while published /en pages
# continue to win because this rule does not force over existing files.
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404
  force = false

# Netlify Pretty URLs normalizes published directory indexes to a trailing slash.
# Do not add a catch-all slash redirect: Netlify matches both slash variants,
# so missing French paths would redirect indefinitely instead of serving 404.html.
